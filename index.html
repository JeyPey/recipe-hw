<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Omelette Recipe</title>
</head>

<body>
    <main>
        <article class="recipe-card">
            <header>
                <img src="./images/omlette-header.png" alt="Omelette photo" width="656" height="300" loading="lazy">
                <hgroup>
                    <h1 class="recipe-card__title">Omelette Recipe</h1>
                    <p class="recipe-card__description">A simple and delicious omelette recipe.</p>
                </hgroup>
            </header>

            <section class="preparation">
                <h2 class="recipe-card__subtitle preparation__title">Preparation time</h2>
                <ul class="preparation-list">
                    <li class="preparation-item">
                        <b class="recipe-card__bold-text">Total:</b> Approximately 10 minutes
                    </li>
                    <li class="preparation-item">
                        <b class="recipe-card__bold-text">Preparation:</b> 5 minutes
                    </li>
                    <li class="preparation-item">
                        <b class="recipe-card__bold-text">Cooking:</b> 5 minutes
                    </li>
                </ul>
            </section>

            <section class="ingredients">
                <h2 class="recipe-card__subtitle">Ingredients</h2>
            </section>

            <hr>

            
        </article>
    </main>
</body>

</html>
